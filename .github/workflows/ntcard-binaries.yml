# .github/workflows/ntcard-binaries.yml
name: ntcard-binaries
on:
  workflow_dispatch:
    inputs:
      ntcard_ref:
        description: "ntCard git tag or commit"
        default: "1.2.2"
        required: true

env:
  NTCARD_REF: ${{ inputs.ntcard_ref || '1.2.2' }}
  NTCARD_REPO: https://github.com/bcgsc/ntCard

jobs:
  linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      # clone + checkout so a commit sha works as well as a tag
      - run: git clone "$NTCARD_REPO" && git -C ntCard checkout "$NTCARD_REF"
      # Build inside a throwaway Alpine container instead of a job container:
      # JS actions (upload-artifact) cannot run in Alpine on arm64 runners.
      - run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:3.20 sh -euc '
            apk add --no-cache build-base autoconf automake zlib-dev zlib-static
            cd ntCard
            # dlsym(RTLD_NEXT) does not work in a static binary; route the
            # fopen/open hooks through the linker --wrap mechanism instead.
            patch -p1 < ../.github/patches/ntcard-static-uncompress.patch
            ./autogen.sh
            # musl does not transitively include sys/types.h; GCC emits a false
            # positive -Warray-bounds on inlined ntHash code, fatal under -Werror.
            ./configure \
              CXXFLAGS="-O3 -Wno-error -Wno-array-bounds -include sys/types.h" \
              LDFLAGS="-static"
            make -j"$(nproc)" \
              LDFLAGS="-fopenmp -static -Wl,--wrap=fopen,--wrap=fopen64,--wrap=open"
            strip ntcard
            file ntcard | grep -q "statically linked"
          '
      - run: .github/scripts/ntcard-smoke-test.sh ntCard/ntcard
      - run: |
          cd ntCard
          out="ntcard-${NTCARD_REF}-linux-${ARCH}"
          mv ntcard "$out"
          sha256sum "$out" > "$out.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: "ntcard-linux-${{ matrix.arch }}"
          path: ntCard/ntcard-*

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: x86_64, runner: macos-15-intel }
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install autoconf automake gcc
      - run: git clone "$NTCARD_REPO" && git -C ntCard checkout "$NTCARD_REF"
      - run: |
          cd ntCard
          # Apple clang has no OpenMP runtime and rejects -static-libgcc, so
          # both CC and CXX must point at the Homebrew GCC.
          # Runners ship older GCCs too, so resolve through the brew formula prefix.
          PREFIX="$(brew --prefix gcc)"
          GXX=$(ls "$PREFIX"/bin/g++-[0-9]* | head -n1)
          GCC="${GXX/g++/gcc}"
          # link libgomp statically so the binary does not depend on Homebrew gcc
          LIBGOMP="$PREFIX/lib/gcc/current/libgomp.a"
          test -f "$LIBGOMP"
          ./autogen.sh
          ./configure CC="$GCC" CXX="$GXX" \
            CXXFLAGS="-O3 -Wno-error -Wno-array-bounds" \
            LDFLAGS="-static-libgcc -static-libstdc++ -Wl,-dead_strip_dylibs" \
            LIBS="$LIBGOMP"
          make -j"$(sysctl -n hw.ncpu)"
          strip ntcard
          otool -L ntcard
          ! otool -L ntcard | grep -qE '/opt/homebrew|/usr/local'
      - run: .github/scripts/ntcard-smoke-test.sh ntCard/ntcard
      - run: |
          cd ntCard
          out="ntcard-${NTCARD_REF}-macos-${ARCH}"
          mv ntcard "$out"
          shasum -a 256 "$out" > "$out.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: "ntcard-macos-${{ matrix.arch }}"
          path: ntCard/ntcard-*
