name: Deploy docs

on:
  push:
    branches:
      - docs
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      delete_version:
        description: "Docs version to delete after deploy (optional, e.g. 0.6.3)"
        required: false
        default: ""

# Deploys all write to gh-pages: run them one at a time
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  # Push to docs branch: build and publish to gh-pages/preview (hidden)
  preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/docs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: python -m pip install --upgrade pip && pip install -e .[docs]

      - name: Build site
        run: mkdocs build

      - name: Deploy preview
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          target-folder: preview
          commit-message: Deploy docs preview

  # Push to main: "main" version (overwritten on each push)
  # Tag vX.Y.Z or manual trigger: X.Y.Z version, aliased "latest"
  versioned:
    if: github.event_name != 'push' || github.ref != 'refs/heads/docs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: python -m pip install --upgrade pip && pip install -e .[docs]

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve docs version
        id: version
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "version=main" >> "$GITHUB_OUTPUT"
            echo "title=main (${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"
            echo "alias=" >> "$GITHUB_OUTPUT"
            echo "release=" >> "$GITHUB_OUTPUT"
          else
            # Strip pre/dev suffix so 0.6.3.dev0 -> 0.6.3
            version=$(python -c "from importlib.metadata import version; from packaging.version import Version; v=Version(version('kmhelpers')); print(v.base_version)")
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "title=$version" >> "$GITHUB_OUTPUT"
            echo "alias=latest" >> "$GITHUB_OUTPUT"
            echo "release=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy with mike
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TITLE: ${{ steps.version.outputs.title }}
          ALIAS: ${{ steps.version.outputs.alias }}
          # Selects release-only/dev-only blocks (scripts/mkdocs_hooks.py)
          DOCS_RELEASE: ${{ steps.version.outputs.release }}
        run: mike deploy --push --update-aliases --title "$TITLE" "$VERSION" $ALIAS

      - name: Delete old docs version
        if: inputs.delete_version != ''
        env:
          OLD: ${{ inputs.delete_version }}
          NEW: ${{ steps.version.outputs.version }}
        run: |
          # Never delete the version that was just deployed (it holds latest)
          if [ "$OLD" = "$NEW" ]; then
            echo "Refusing to delete the deployed version $NEW" >&2
            exit 1
          fi
          mike delete --push "$OLD"
