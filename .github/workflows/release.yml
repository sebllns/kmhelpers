name: Release build

on:
  push:
    tags:
      - "v*"

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags, to find the previous release tag
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      # Catches packages missing from pyproject.toml, which source-tree tests miss
      - name: Smoke test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/kmhelpers --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      # Without a body, GitHub shows the tag message as plain text
      # GitHub guesses the previous tag from the tag history, which misses it
      # when the tag is not on main, so it is passed explicitly: the highest
      # version below this one.
      - name: Build release notes from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          prev=$(git tag -l 'v*' --sort=-v:refname | awk -v t="$GITHUB_REF_NAME" 'f {print; exit} $0 == t {f = 1}')
          {
            sed "s/@VERSION@/$v/g" .github/release-notes.md
            printf '\n## Changes\n'
            awk -v v="$v" '/^## \[/{p=index($0,"["v"]")>0; next} p' CHANGELOG.md
            printf '\n'
            # Merged PRs and a compare link to the previous tag
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" ${prev:+-f previous_tag_name="$prev"} \
              --jq .body
          } > notes.md

      - name: Publish release with dists
        uses: softprops/action-gh-release@v2
        with:
          name: kmhelpers ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*

  publish:
    # Trusted publisher (OIDC), configured at
    # https://pypi.org/manage/project/kmhelpers/settings/publishing/
    # The pypi environment only allows v* tags and requires an approval.
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1