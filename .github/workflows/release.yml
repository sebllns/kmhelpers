name: Release build

on:
  push:
    tags:
      - "v*"

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      # Without a body, GitHub shows the tag message as plain text
      - name: Build release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            sed "s/@VERSION@/$v/g" .github/release-notes.md
            printf '\n## Changes\n'
            awk -v v="$v" '/^## \[/{p=index($0,"["v"]")>0; next} p' CHANGELOG.md
          } > notes.md

      - name: Publish release with dists
        uses: softprops/action-gh-release@v2
        with:
          name: kmhelpers ${{ github.ref_name }}
          body_path: notes.md
          # Appends merged PRs and a compare link to the previous tag
          generate_release_notes: true
          files: dist/*

  publish:
    # Disabled for now. To enable: remove this `if: false` line and configure
    # a PyPI trusted publisher for this repo/workflow at
    # https://pypi.org/manage/account/publishing/ (pending publisher, project
    # "kmhelpers"), then https://pypi.org/manage/project/kmhelpers/settings/publishing/
    if: false
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1